<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>故事星球｜彭文玥</title><style>body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#101b4a,#472b68);color:#fff;min-height:100vh}.wrap{max-width:1080px;margin:auto;padding:36px 20px}.card{background:#ffffff14;border:1px solid #ffffff24;border-radius:24px;padding:24px;backdrop-filter:blur(8px);box-shadow:0 16px 50px #0004}h1{font-size:36px;margin:0 0 8px}.sub{color:#cdd6ff}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}}label{display:block;margin-top:14px;color:#dfe6ff}input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff30;background:#10183b;color:#fff;box-sizing:border-box}button{margin-top:18px;background:#ffbd68;color:#201438;font-weight:700;cursor:pointer}.themes{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.theme{width:auto;padding:10px 14px}.theme.active{background:#9ee7ff;color:#15203f}.scene{margin:18px 0;padding:18px;border-radius:18px;background:#0b1536aa}.scene h3{margin:0 0 8px;color:#ffe29a}.moral{padding:16px;border-left:4px solid #ffbd68;background:#ffffff10}</style></head>
<body><div class="wrap"><div class="card"><h1>故事星球</h1><div class="sub">彭文玥的多模态儿童故事工坊 · 作业0交互网页</div><div class="grid"><section><h2>故事设置</h2><label>主角名字<input id="name" value="彭文玥"></label><label>主角年龄<input id="age" type="number" value="10"></label><label>兴趣<input id="interest" value="星空观察"></label><label>主题</label><div class="themes"><button class="theme active" data-theme="勇气与友谊">勇气与友谊</button><button class="theme" data-theme="想象与探索">想象与探索</button><button class="theme" data-theme="分享与成长">分享与成长</button></div><button id="generate">生成我的故事</button></section><section><h2 id="title">彭文玥和月光森林的星星邮局</h2><div id="story"></div></section></div></div></div><script>
const baseScenes=[['神秘的星星邮局','彭文玥在月光森林观察星空时，看见一封银色信件从云层飘来。'],['坚定的雾桥之旅','彭文玥和云朵兔沿着发光脚印走到雾桥，决定牵着手一起走过去。'],['明亮的星光湖','彭文玥把信件交给星光鲸，蓝色光点组成了一条回家的路。']]; let theme='勇气与友谊';
function render(){const name=document.querySelector('#name').value||'彭文玥'; document.querySelector('#title').textContent=`${name}和月光森林的星星邮局`; document.querySelector('#story').innerHTML=baseScenes.map((s,i)=>`<article class="scene"><h3>第${i+1}幕｜${s[0]}</h3><p>${s[1].replaceAll('彭文玥',name)}</p><small>主题：${theme} · 角色：${name}、云朵兔、星光鲸</small></article>`).join('')+`<div class="moral">故事寓意：真正的勇气来自愿意和朋友一起面对未知，也来自把善意传递给需要帮助的人。</div>`}
document.querySelectorAll('.theme').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.theme').forEach(x=>x.classList.remove('active'));btn.classList.add('active');theme=btn.dataset.theme;render()})); document.querySelector('#generate').addEventListener('click',render); render();
</script></body></html>
