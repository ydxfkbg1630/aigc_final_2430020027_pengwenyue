<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>故事星球同步朗读</title><style>body{font-family:system-ui,"Microsoft YaHei";max-width:900px;margin:40px auto;background:#111a35;color:#fff;padding:20px}audio{width:100%}.line{padding:16px;border-radius:12px;background:#24325e;margin:10px 0}.active{background:#f3b45f;color:#23183b}</style><h1>故事星球｜同步高亮文本</h1><p>作者：彭文玥</p><audio id="audio" controls src="../outputs/audio/narrator.mp3"></audio><div id="lines"></div><script>const lines=['彭文玥在月光森林观察星空时，看见一封银色信件从云层飘来。','彭文玥和云朵兔沿着发光脚印走到雾桥，决定牵着手一起走过去。','彭文玥把信件交给星光鲸，蓝色光点组成了一条回家的路。'];const box=document.querySelector('#lines'); lines.forEach((x,i)=>{const el=document.createElement('div');el.className='line';el.textContent=x;box.appendChild(el)});document.querySelector('#audio').addEventListener('timeupdate',e=>{const index=Math.min(lines.length-1,Math.floor(e.target.currentTime/24));[...box.children].forEach((x,i)=>x.classList.toggle('active',i===index))});</script>
